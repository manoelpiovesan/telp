<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulação de Álgebra Linear</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="stylesheet" href="./style.css" />
</head>
<body data-bs-theme="light">
  <div class="container-fluid app py-3">
    <header class="topbar d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2 mb-3">

      <p id="fpsLabel" class="mb-0 text-secondary">FPS: 0</p>
    </header>

    <main class="row g-3">
      <section class="col-12 col-lg-8 col-xl-9">
        <div class="table-wrapper">
        <canvas id="tableCanvas" aria-label="Mesa da simulação"></canvas>
        <div id="pausedBadge" class="paused-badge hidden">PAUSADO</div>
        </div>
      </section>

      <aside class="col-12 col-lg-4 col-xl-3">
        <div class="panel card shadow-sm">
          <div class="card-body p-3">
            <h2 class="section-title">
              <i class="bi bi-activity me-2"></i>Simulação
            </h2>
            <div class="table-responsive mb-3">
              <table class="table table-sm table-borderless table-panel align-middle mb-0">
                <tbody>
                <tr>
                  <th scope="row"><i class="bi bi-circle-fill me-2"></i>Bolas</th>
                  <td class="text-end"><span id="ballsCount">0</span></td>
                </tr>
                <tr>
                  <th scope="row"><i class="bi bi-intersect me-2"></i>Interseções</th>
                  <td class="text-end"><span id="intersectionsCount">0</span></td>
                </tr>
                <tr>
                  <th scope="row"><i class="bi bi-bullseye me-2"></i>Primeiro impacto</th>
                  <td class="text-end"><span id="firstHitLabel">Nenhum</span></td>
                </tr>
                <tr>
                  <th scope="row"><i class="bi bi-rulers me-2"></i>Distância</th>
                  <td class="text-end"><span id="firstHitDistance">-</span></td>
                </tr>
                </tbody>
              </table>
            </div>

            <h2 class="section-title">
              <i class="bi bi-cursor-fill me-2"></i>Taco
            </h2>
            <div class="table-responsive mb-3">
              <table class="table table-sm table-borderless table-panel align-middle mb-0">
                <tbody>
                <tr>
                  <th scope="row"><i class="bi bi-geo-alt me-2"></i>Posição</th>
                  <td class="text-end"><span id="cuePosition">[0.00, 0.00]</span></td>
                </tr>
                <tr>
                  <th scope="row"><i class="bi bi-arrow-up-right me-2"></i>Direção</th>
                  <td class="text-end"><span id="cueDirection">[0.00, 0.00]</span></td>
                </tr>
                <tr>
                  <th scope="row"><i class="bi bi-calculator me-2"></i>||d||</th>
                  <td class="text-end"><span id="cueDirectionNorm">0.00</span></td>
                </tr>
                </tbody>
              </table>
            </div>

            <h2 class="section-title">
              <i class="bi bi-keyboard me-2"></i>Controles
            </h2>
            <div class="table-responsive">
              <table class="table table-sm table-borderless table-panel align-middle mb-0">
                <tbody>
                <tr>
                  <th scope="row"><i class="bi bi-mouse2 me-2"></i>Mouse</th>
                  <td class="text-end">Aponta o taco</td>
                </tr>
                <tr>
                  <th scope="row"><i class="bi bi-pause-circle me-2"></i>Space</th>
                  <td class="text-end">Pausa / continua</td>
                </tr>
                <tr>
                  <th scope="row"><i class="bi bi-arrow-clockwise me-2"></i>R</th>
                  <td class="text-end">Reinicia</td>
                </tr>
                <tr>
                  <th scope="row"><i class="bi bi-bug me-2"></i>D</th>
                  <td class="text-end">Debug matemático</td>
                </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script defer src="./src/vector.js"></script>
  <script defer src="./src/collision.js"></script>
  <script defer src="./src/physics.js"></script>
  <script defer src="./src/input.js"></script>
  <script defer src="./src/renderer.js"></script>
  <script defer src="./src/engine.js"></script>
  <script defer src="./src/main.js"></script>
</body>
</html>
